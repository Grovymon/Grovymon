<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-labelledby="title desc">
  <title id="title">What a clown I am</title>
  <desc id="desc">A playful Grovymon tagline on a dark gradient background</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b25"/>
      <stop offset="0.48" stop-color="#111a48"/>
      <stop offset="1" stop-color="#251250"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66d9ff"/>
      <stop offset="0.48" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#786cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#786cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="3" result="offsetBlur"/>
      <feFlood flood-color="#00031a" flood-opacity="0.75"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="118" rx="18" fill="url(#background)" stroke="#404d8e" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="116" rx="17" fill="url(#glow)"/>

  <g fill="#bdd4ff" opacity="0.75">
    <circle cx="62" cy="35" r="1.6"/>
    <circle cx="118" cy="95" r="1.2"/>
    <circle cx="184" cy="27" r="1"/>
    <circle cx="738" cy="31" r="1.3"/>
    <circle cx="815" cy="92" r="1.7"/>
    <circle cx="857" cy="45" r="1"/>
  </g>

  <text x="450" y="78" text-anchor="middle" fill="url(#textGradient)" filter="url(#shadow)"
        font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="2">
    WHAT A CLOWN I AM
  </text>
</svg>
